services:
  outreachemailmcp:
    build: .
    restart: unless-stopped
    # HTTP (UI + REST + MCP) is NOT host-published by default: on Dokploy /
    # Traefik setups, attach a domain to container port 3000 — the proxy
    # reaches it over the docker network, and publishing it would conflict
    # with whatever already uses host port 3000. For plain `docker compose up`
    # without a reverse proxy, copy docker-compose.override.example.yml to
    # docker-compose.override.yml to publish it.
    expose:
      - "3000"
    ports:
      # SMTP + IMAP are raw TCP — these must stay host-published (a reverse
      # proxy like Traefik does not route them by default).
      - "${SMTP_PUBLISH_PORT:-2525}:2525"
      - "${IMAP_PUBLISH_PORT:-1143}:1143"
      # Implicit-TLS variants (465/993). Most sequencers assume SSL-on-connect
      # for mail ports, so these are what the CSV export advertises.
      - "${SMTPS_PUBLISH_PORT:-465}:465"
      - "${IMAPS_PUBLISH_PORT:-993}:993"
    environment:
      MASTER_KEY: ${MASTER_KEY:?Set MASTER_KEY (openssl rand -base64 32)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      HTTP_BIND: 0.0.0.0
      SMTP_BIND: 0.0.0.0
      IMAP_BIND: 0.0.0.0
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      POLL_INTERVAL: ${POLL_INTERVAL:-60}
      SAAS_MODE: ${SAAS_MODE:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      SMTP_TLS_CERT: ${SMTP_TLS_CERT:-}
      SMTP_TLS_KEY: ${SMTP_TLS_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-}
      HEALTH_REPORT_TO: ${HEALTH_REPORT_TO:-}
      HEALTH_REPORT_HOUR: ${HEALTH_REPORT_HOUR:-7}
      HEALTH_REPORT_ALWAYS: ${HEALTH_REPORT_ALWAYS:-false}
    volumes:
      # Everything lives here: SQLite DB (accounts, encrypted tokens, queue),
      # message spool, TLS certs. Back this volume up.
      # On Dokploy you may prefer a bind mount into its managed files dir:
      #   - ../files/data:/data
      - outreachemailmcp-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  outreachemailmcp-data:
